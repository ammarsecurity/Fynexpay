# aaPanel extension for api.fynexpay.net
# Place at: /www/server/panel/vhost/nginx/extension/api.fynexpay.net/proxy.conf
#
# Use ^~ for app routes so aaPanel's static regex locations (*.js / *.png)
# do not steal checkout assets and API paths from the Docker proxy.
# Also copy wwwroot static files (checkout-copy.js, logos, providers/) into
# /www/wwwroot/api.fynexpay.net/ so filesystem fallbacks work.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:5088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    client_max_body_size 20m;
}
